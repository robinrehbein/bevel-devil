name: Play test release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-test-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      # without these the build falls back to Google's test ads
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # the default also installs 'tools', which current cmdline-tools no longer ship
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release credentials
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
      - name: Prepare credentials
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          echo "ANDROID_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/play-service-account.json" >> "$GITHUB_ENV"
      - name: Test and build signed app bundle
        run: |
          ./gradlew --no-daemon testDebugUnitTest bundleRelease \
            -PreleaseVersionCode="$((10000 + GITHUB_RUN_NUMBER))" \
            -PreleaseVersionName="0.6.0.$GITHUB_RUN_NUMBER"
      - name: Publish to internal and Alpha
        run: |
          python -m pip install --disable-pip-version-check 'google-auth==2.40.3' 'requests==2.32.4'
          python scripts/publish_play.py \
            --bundle app/build/outputs/bundle/release/app-release.aab \
            --package com.robinrehbein.beveldevil \
            --tracks internal alpha
